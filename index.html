<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תל אביב אדריכלית | STS ARCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
<style>
/* Layout: a presentation board. Index sheet on the right, 3D site model in the middle, building plate on the left. */
/* הפונט הראשי: שים את קובץ הפונט שלך בתיקייה fonts ליד הקובץ, בשם display.woff2 (או שנה את הנתיב). עד אז: Rubik 900. */
@font-face{font-family:"STS Display";src:url("fonts/display.woff2") format("woff2"),url("fonts/display.otf") format("opentype"),url("fonts/display.ttf") format("truetype");font-display:swap}
:root{
  --paper:#FFFFFF;
  --board:#F2F4F6;
  --ink:#14212E;
  --ink-soft:#5A6774;
  --line:#CBD4DC;
  --era-1:#A8C6E1;  /* אקלקטי */
  --era-2:#6C9BC8;  /* בינלאומי */
  --era-3:#3A6A99;  /* ברוטליזם */
  --era-4:#16365A;  /* עכשווי */
  --display:"STS Display","Rubik",Arial,sans-serif;
  --body:"Rubik","Arial Hebrew",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--board);color:var(--ink);font-family:var(--body);font-size:14px}
#map{position:fixed;inset:0}
.disp{font-family:var(--display);font-weight:900;letter-spacing:-.01em;line-height:.95}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
button{font:inherit}
:focus-visible{outline:2px solid var(--era-3);outline-offset:2px}

/* ---------- index sheet ---------- */
.sheet{position:fixed;top:16px;right:16px;bottom:16px;width:360px;background:var(--paper);border:1px solid var(--ink);
  display:flex;flex-direction:column;z-index:2}
.sheet header{padding:18px 18px 14px;border-bottom:1px solid var(--ink)}
.sheet h1{font-size:46px;margin:8px 0 6px}
.sheet .sub{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;color:var(--ink-soft);direction:ltr}
.legend{padding:12px 18px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.legend h3{margin:0 0 4px;font-size:12px;font-weight:700}
.lg{display:flex;align-items:center;gap:10px;font-size:12.5px;cursor:pointer;border:none;background:none;padding:2px 0;text-align:right;color:var(--ink)}
.lg .sw{width:22px;height:12px;border:1px solid var(--ink)}
.lg .rng{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-inline-start:auto;direction:ltr}
.lg[aria-pressed="false"]{opacity:.35}
.tools{display:flex;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line)}
.search{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);font:inherit;background:var(--paper);color:var(--ink)}
.count{font-family:var(--mono);font-size:11px;color:var(--ink-soft);padding:8px 18px 4px}
.list{list-style:none;margin:0;padding:0 0 10px;overflow:auto;flex:1}
.item{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 18px;cursor:pointer;border-bottom:1px solid #EEF1F4}
.item:hover,.item.active{background:var(--board)}
.item b{display:block;font-weight:500;font-size:14px}
.item small{color:var(--ink-soft);font-size:12px}
.yr{font-family:var(--mono);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tag{font-family:var(--mono);font-size:11px;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--ink)}
.sheet footer{border-top:1px solid var(--ink);padding:8px 18px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);direction:ltr}

/* ---------- map chrome ---------- */
.bar{position:fixed;top:16px;left:16px;z-index:2;display:flex;gap:0;background:var(--paper);border:1px solid var(--ink)}
.bar button{border:none;border-inline-start:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 12px;cursor:pointer;font-size:12.5px}
.bar button:first-child{border-inline-start:none}
.bar button[aria-pressed="true"]{background:var(--ink);color:#fff}
.north{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:2;font-family:var(--mono);font-size:10.5px;color:var(--ink);
  background:rgba(255,255,255,.85);border:1px solid var(--ink);padding:4px 10px;direction:ltr;letter-spacing:.08em}

.pin{width:24px;height:24px;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;border:1.5px solid var(--ink);
  cursor:pointer;transition:transform .15s;box-shadow:2px 2px 0 rgba(20,33,46,.35)}
.pin:hover,.pin.active{transform:scale(1.3)}
.pin.active{outline:2px solid var(--ink);outline-offset:3px}
.pin.dim{display:none}

/* ---------- building plate ---------- */
.plate{position:fixed;top:64px;left:16px;bottom:16px;width:420px;background:var(--paper);border:1px solid var(--ink);z-index:3;overflow:auto}
.plate .photo{position:relative;aspect-ratio:16/10;background:var(--board);border-bottom:1px solid var(--ink);overflow:hidden;max-width:100%}
.plate .photo img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.15) contrast(1.03)}
.plate .photo .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-soft);font-family:var(--mono);font-size:11px}
.plate .num{position:absolute;top:0;right:0;background:var(--paper);border-left:1px solid var(--ink);border-bottom:1px solid var(--ink);
  font-family:var(--mono);font-size:22px;padding:6px 12px}
.credit{font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);padding:4px 18px;direction:ltr;text-align:left;border-bottom:1px solid var(--line)}
.credit a{color:inherit}
.close{position:absolute;top:8px;left:8px;width:34px;height:34px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;font-size:20px;line-height:1;z-index:3}
.plate .body{padding:16px 18px 22px;display:grid;gap:16px}
.plate h2{font-size:38px;margin:4px 0 2px;text-wrap:balance}
.plate .en{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);direction:ltr;text-align:right}
.ctx{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
.circle-wrap{display:grid;gap:6px;justify-items:center}
.circle{width:150px;height:150px;border-radius:50%;overflow:hidden;border:1px solid var(--ink);position:relative;background:var(--board)}
.circle .mm{position:absolute;inset:0}
.circle::after{content:"";position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border:1.5px solid var(--ink);border-radius:50%;pointer-events:none}
.circle-wrap small{font-family:var(--mono);font-size:10px;color:var(--ink-soft);direction:ltr}
.spec{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0;font-size:12.5px;align-content:start}
.spec dt{color:var(--ink-soft)}
.spec dd{margin:0;font-weight:500}
.sec h4{margin:0 0 6px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec h4::before{content:"";width:10px;height:10px;background:var(--ink)}
.ignote{font-size:11.5px;color:var(--ink-soft);margin:0 0 10px}
.igsec .instagram-media{border-radius:0!important;box-shadow:none!important;border:1px solid var(--line,#c9d3dc)!important}
.sec p{margin:0;line-height:1.65;font-size:14px;max-width:62ch}
.look{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.look li{display:grid;grid-template-columns:18px 1fr;gap:6px;font-size:13.5px;line-height:1.5}
.look li::before{content:"+";font-family:var(--mono);color:var(--era-3)}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:7px 12px;cursor:pointer;font-size:13px;text-decoration:none}
.btn.primary{background:var(--ink);color:#fff}
.sig{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);direction:ltr;text-align:left}

.plate .photo img{cursor:zoom-in}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border:1px solid var(--ink);background:rgba(255,255,255,.92);
  color:var(--ink);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;z-index:2}
.photo .prev{right:10px}.photo .next{left:10px}
.gcount{direction:ltr;position:absolute;bottom:0;left:0;background:var(--ink);color:#fff;font-size:11px;padding:4px 9px}
.thumbs{display:flex;gap:4px;padding:6px 18px 0;overflow-x:auto}
.th{flex:0 0 64px;height:46px;padding:0;border:1px solid var(--line);background:var(--board);cursor:pointer;opacity:.55}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th[aria-current="true"]{opacity:1;border-color:var(--ink);outline:1px solid var(--ink)}
.dwgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dwgs figure{margin:0;border:1px solid var(--line);background:#fff}
.dwgs img{width:100%;display:block}
.dwgs figcaption{font-size:11px;color:var(--ink-soft);padding:4px 6px}
.lightbox{position:fixed;inset:0;z-index:10;background:rgba(10,18,26,.94);display:grid;grid-template-rows:auto 1fr auto;padding:16px}
.lightbox img{max-width:100%;max-height:100%;margin:auto;object-fit:contain;min-height:0;align-self:center}
.lbbar{display:flex;justify-content:space-between;align-items:center;color:#fff}
.lbtitle{font-size:28px}
.lbclose{width:36px;height:36px;border:1px solid #fff;background:none;color:#fff;font-size:20px;cursor:pointer}
.lightbox .lbprev{right:16px}.lightbox .lbnext{left:16px}
.lbcap{color:#C9D3DC;font-size:11px;text-align:center;padding-top:8px;direction:ltr}
.lbcap a{color:inherit}
.pin.area{background:rgba(255,255,255,.85)!important;color:var(--ink)!important;border:1.5px dashed var(--ink);box-shadow:none}
.office{flex:0 0 46%;cursor:pointer}
.hero{position:absolute;inset:0}
.herotag{position:absolute;bottom:0;right:0;background:var(--ink);color:#fff;font-size:10.5px;padding:4px 9px;letter-spacing:.06em;direction:ltr}
.heropin{width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 0 0 2px var(--ink)}
.photo .noimg{flex-direction:column;gap:6px;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,var(--board) 0 10px,#fff 10px 20px)}
.photo .noimg span:first-child{margin-top:34px;padding:0 16px;text-align:center;font-family:var(--body);font-size:15px;font-weight:700;color:var(--ink)}
.ctx.nocircle{grid-template-columns:1fr}
.token-msg{position:fixed;inset:0;display:grid;place-items:center;z-index:9;background:var(--board);padding:24px;text-align:center}

@media (max-width:860px){
  .sheet{top:auto;left:0;right:0;bottom:0;width:auto;height:42vh;border-width:1px 0 0}
  .sheet header{padding:12px 16px 10px}.sheet h1{font-size:30px}
  .legend{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:14px;padding:8px 16px}.legend h3{display:none}.lg .rng{display:none}
  .sheet footer{display:none}
  .plate{top:auto;left:0;right:0;bottom:0;width:auto;height:78vh;border-width:1px 0 0}
  .plate h2{font-size:30px}
  .ctx{grid-template-columns:120px 1fr}.circle{width:120px;height:120px}
  .bar{left:8px;top:8px}.bar button{padding:6px 9px;font-size:12px}
  .north{display:none}
}
@media (prefers-reduced-motion:reduce){.pin{transition:none}}

.bar .locbtn{display:flex;align-items:center;gap:7px;border-inline-start:1px solid var(--ink)!important;font-weight:700}
.bar .locbtn[aria-pressed="true"]{background:#2F80ED;color:#fff}
.locbtn .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor}
.locbtn .dot.on{background:#2F80ED;border-color:#fff;box-shadow:0 0 0 3px rgba(47,128,237,.35)}
.me{width:16px;height:16px;border-radius:50%;background:#2F80ED;border:3px solid #fff;box-shadow:0 0 0 0 rgba(47,128,237,.5);animation:mepulse 2s infinite}
@keyframes mepulse{0%{box-shadow:0 0 0 0 rgba(47,128,237,.5)}70%{box-shadow:0 0 0 18px rgba(47,128,237,0)}100%{box-shadow:0 0 0 0 rgba(47,128,237,0)}}
@media (prefers-reduced-motion:reduce){.me{animation:none}}
.nearhead{list-style:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-soft);padding:8px 2px 4px;border-bottom:1px solid var(--ink)}
.yr .dist{display:block;font-family:var(--mono);font-weight:700;color:var(--ink)}
.yr .walk{display:block;font-size:10px;color:var(--ink-soft)}
.toast{position:fixed;bottom:56px;left:16px;z-index:5;max-width:min(360px,calc(100vw - 32px));background:var(--ink);color:#fff;padding:10px 14px;font-size:13px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}

.igwrap{display:grid;grid-template-columns:1fr;gap:10px}
.igf{margin:0}.igfr{display:block;width:100%;aspect-ratio:1/1.32;border:1px solid var(--line);background:#fff}.igf figcaption a{color:var(--ink-soft);text-decoration:none}.igf figcaption{font-size:10px;color:var(--ink-soft);direction:ltr;text-align:left;padding-top:2px}
.docs{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.docs li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.docs a{color:var(--ink);font-weight:700;text-decoration:none}.docs a:hover{text-decoration:underline}
.docs a::after{content:" ↗";font-weight:400}
.docs small{font-size:11px;color:var(--ink-soft)}
@media (max-width:760px){.bar{flex-wrap:wrap;max-width:calc(100vw - 16px)}}
.bar .viewbtn{border-inline-start:1px solid var(--ink)!important;font-weight:700}
.bar .viewbtn[aria-pressed="true"]{background:var(--ink);color:#fff}
.pin.future{border:1.5px dashed var(--ink)!important;background:#fff!important;color:var(--ink)!important}
.lg[data-era="future"] .sw{border:1.5px dashed var(--ink);background:#fff!important}
.futnote{margin-top:8px;padding:6px 8px;border:1px dashed var(--ink);font-size:12px;background:#fff}
</style>
</head>

/* ================= אתחול ================= */
if(!MAPBOX_TOKEN || MAPBOX_TOKEN.startsWith("YOUR_")){
  document.body.insertAdjacentHTML("beforeend",'<div class="token-msg"><h1 class="disp">חסר Mapbox token</h1></div>');
  throw new Error("Missing Mapbox token");
}
mapboxgl.accessToken = MAPBOX_TOKEN;
if(mapboxgl.getRTLTextPluginStatus()==="unavailable") mapboxgl.setRTLTextPlugin("https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-rtl-text/v0.3.0/mapbox-gl-rtl-text.js", null, true);
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const map = new mapboxgl.Map({container:"map",style:STYLE_URL,center:[34.7872,32.0790],zoom:13.4,pitch:60,bearing:71,antialias:true});
map.addControl(new mapboxgl.NavigationControl({visualizePitch:true}),"bottom-right");
map.addControl(new mapboxgl.ScaleControl({unit:"metric"}),"bottom-right");
function setCfg(m,key,val){ try{ m.setConfigProperty("basemap",key,val); }catch(e){} }
map.on("style.load",()=>{
  setCfg(map,"theme","monochrome");
  setCfg(map,"showPointOfInterestLabels",false);
  setCfg(map,"showTransitLabels",false);
});

const state={eras:new Set(Object.keys(ERAS)),q:"",office:"",active:null};
/* משרדים: נגזר משדה arch, ממוין לפי מספר הפרויקטים במפה */
const officeOf=a=>String(a).split(/[,+;(–]| \/ /)[0].trim();
const officeCount={};BUILDINGS.forEach(b=>{String(b.arch).split(/[,+;(]/).map(x=>x.replace(/\).*/,"").replace(/^\s*(חידוש|מקור|כיכר):\s*/,"").replace(/^\s*שימור:.*$/,"").trim()).filter(x=>x.length>2&&!/^\d/.test(x)).forEach(o=>{officeCount[o]=(officeCount[o]||0)+1;});});
const officeSel=document.getElementById("office");
Object.entries(officeCount).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"he")).forEach(([o,n])=>{const opt=document.createElement("option");opt.value=o;opt.textContent=`${o} (${n})`;officeSel.appendChild(opt);});
officeSel.addEventListener("change",e=>{state.office=e.target.value;render();});
const markers=new Map();

/* legend = filter */
const legendEl=document.getElementById("legend");
Object.entries(ERAS).forEach(([k,e])=>{
  const n=BUILDINGS.filter(b=>b.era===k).length;
  legendEl.insertAdjacentHTML("beforeend",`<button class="lg" data-era="${k}" aria-pressed="true"><span class="sw" style="background:${e.color}"></span>${e.label} <span class="mono" style="color:var(--ink-soft);font-size:11px">(${n})</span><span class="rng">${e.range}</span></button>`);
});
legendEl.addEventListener("click",e=>{
  const b=e.target.closest(".lg"); if(!b) return;
  const k=b.dataset.era;
  if(state.eras.size===Object.keys(ERAS).length){ state.eras=new Set([k]); }
  else if(state.eras.has(k)){ state.eras.delete(k); if(!state.eras.size) state.eras=new Set(Object.keys(ERAS)); }
  else state.eras.add(k);
  legendEl.querySelectorAll(".lg").forEach(x=>x.setAttribute("aria-pressed",state.eras.has(x.dataset.era)));
  render();
});
document.getElementById("search").addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase();render();});
const visible=b=>state.eras.has(b.era)&&(!state.office||String(b.arch).includes(state.office))&&(!state.q||[b.he,b.en,b.arch,b.hood,b.year].join(" ").toLowerCase().includes(state.q));

/* pins */
BUILDINGS.forEach(b=>{
  if(b.priv==="none") return;
  const el=document.createElement("div");
  if(b.priv==="area") el.classList.add("area");
  el.classList.add("pin"); if(b.era==="future") el.classList.add("future"); el.textContent=String(b.id).padStart(2,"0");
  if(b.priv!=="area"){ el.style.background=ERAS[b.era].color; el.style.color=ERAS[b.era].text; }
  el.setAttribute("role","button"); el.setAttribute("aria-label",b.he); el.title=b.he;
  el.addEventListener("click",ev=>{ev.stopPropagation();select(b.id);});
  markers.set(b.id,{el,marker:new mapboxgl.Marker({element:el}).setLngLat([b.lng,b.lat]).addTo(map)});
});

/* index list */
const listEl=document.getElementById("list");
function render(){
  let vis=BUILDINGS.filter(visible);
  const np=(typeof near!=="undefined")&&near.pos;
  if(np) vis=vis.map(b=>({b,d:b.lat&&b.priv!=="none"?distM(np,b):Infinity})).sort((x,y)=>x.d-y.d).map(x=>(x.b._d=x.d,x.b));
  document.getElementById("count").textContent=np?`ממוין לפי מרחק ממך · ${vis.length}`:`${vis.length}/${BUILDINGS.length} BUILDINGS`;
  listEl.innerHTML=(np?`<li class="nearhead">הכי קרובים אליך עכשיו</li>`:"")+vis.map(b=>`<li class="item${state.active===b.id?" active":""}" tabindex="0" data-id="${b.id}">
      <span class="tag" style="background:${ERAS[b.era].color};color:${ERAS[b.era].text}">${String(b.id).padStart(2,"0")}</span>
      <span><b>${esc(b.he)}</b><small>${esc(b.arch)}${b.priv?" · בית פרטי":""}</small></span>
      <span class="yr">${np&&isFinite(b._d)?`<span class="dist">${fmtD(b._d)}</span><small class="walk">${walk(b._d)}</small>`:(b.era==="future"?"עתידי":(b.year||"—"))}</span></li>`).join("");
  if(typeof paintFootprints==="function") paintFootprints();
  BUILDINGS.forEach(b=>{const m=markers.get(b.id); if(m) m.el.classList.toggle("dim",!visible(b));});
}
listEl.addEventListener("click",e=>{const li=e.target.closest(".item"); if(li) select(+li.dataset.id);});
listEl.addEventListener("keydown",e=>{if(e.key==="Enter"){const li=e.target.closest(".item"); if(li) select(+li.dataset.id);}});

/* figure-ground circle (second map, plan view) */
let mini=null;
function miniMap(container,b){
  if(mini){ mini.remove(); mini=null; }
  try{
    mini=new mapboxgl.Map({container,style:STYLE_URL,center:[b.lng,b.lat],zoom:16.4,pitch:0,bearing:0,interactive:false,attributionControl:false});
    mini.on("style.load",()=>{ setCfg(mini,"theme","monochrome"); setCfg(mini,"show3dObjects",false);
      ["showPlaceLabels","showRoadLabels","showPointOfInterestLabels","showTransitLabels"].forEach(k=>setCfg(mini,k,false));
      /* figure-ground: בניינים בכחול כהה על רקע לבן, כמו בלוח הצגה */
      try{
        mini.addSource("fg",{type:"vector",url:"mapbox://mapbox.mapbox-streets-v8"});
        mini.addLayer({id:"fg-bg",type:"background",paint:{"background-color":"#FFFFFF"}});
        mini.addLayer({id:"fg-water",type:"fill",source:"fg","source-layer":"water",paint:{"fill-color":"#E3EAF0"}});
        mini.addLayer({id:"fg-roads",type:"line",source:"fg","source-layer":"road",paint:{"line-color":"#CBD4DC","line-width":1}});
        mini.addLayer({id:"fg-bld",type:"fill",source:"fg","source-layer":"building",paint:{"fill-color":"#14212E"}});
      }catch(e){}
    });
  }catch(e){}
}

/* hero: מודל תלת־ממד חי של המבנה, כשאין עדיין צילום */
let hero=null, heroRaf=null;
function heroMap(container,b){
  if(heroRaf){cancelAnimationFrame(heroRaf);heroRaf=null;}
  if(hero){ hero.remove(); hero=null; }
  if(!container) return;
  try{
    hero=new mapboxgl.Map({container,style:STYLE_URL,center:[b.lng,b.lat],zoom:b.priv?16:17.1,pitch:64,bearing:(b.id*47)%360,interactive:false,attributionControl:false});
    hero.on("style.load",()=>{ setCfg(hero,"theme","monochrome"); ["showPlaceLabels","showRoadLabels","showPointOfInterestLabels","showTransitLabels"].forEach(k=>setCfg(hero,k,false)); });
    if(!b.priv){ const d=document.createElement("div"); d.className="heropin"; new mapboxgl.Marker({element:d}).setLngLat([b.lng,b.lat]).addTo(hero); }
    if(!reduceMotion){ const step=()=>{ if(!hero) return; hero.setBearing((hero.getBearing()+0.06)%360); heroRaf=requestAnimationFrame(step); }; hero.once("idle",()=>{heroRaf=requestAnimationFrame(step);}); }
  }catch(e){}
}

/* building plate */
const plate=document.getElementById("plate");
function select(id){
  const b=BUILDINGS.find(x=>x.id===id); if(!b) return;
  state.active=id;
  markers.forEach((m,k)=>m.el.classList.toggle("active",k===id));
  const e=ERAS[b.era], G=b.gal;
  plate.innerHTML=`
    <button class="close" aria-label="סגירה">×</button>
    <div class="photo">${G.length?`<img id="gimg" alt="${esc(b.he)}">`:(b.priv==="none"?`<div class="noimg"><span>בית פרטי · המיקום אינו מפורסם</span><span>PHOTO · STS ARCH</span></div>`:`<div class="hero" id="hero"></div><span class="herotag mono">3D MODEL${(b.ig||[]).length?" · צילומים מקוריים למטה ↓":""}</span>`)}
      <span class="num">${String(b.id).padStart(2,"0")}</span>
      ${G.length>1?`<button class="nav prev" aria-label="תמונה קודמת">‹</button><button class="nav next" aria-label="תמונה הבאה">›</button><span class="gcount mono" id="gcount"></span>`:""}
    </div>
    ${G.length?`<div class="credit" id="gcredit"></div>`:""}
    ${G.length>1?`<div class="thumbs">${G.map((g,i)=>`<button class="th" data-i="${i}" aria-label="תמונה ${i+1}"><img src="${esc(g.src.replace(/\/1280px-/,"/330px-").replace("width=1280","width=330").replace(/_b\.jpg$/,"_n.jpg"))}" alt="" loading="lazy"></button>`).join("")}</div>`:""}
    <div class="body">
      <div>
        <div class="eyebrow">${e.label} · ${e.range}</div>
        <h2 class="disp">${esc(b.he)}</h2>
        <div class="en">${esc(b.en)}</div>
        ${b.era==="future"?`<div class="futnote">פרויקט בתכנון או בביצוע. הצילומים הם הדמיות של המשרד, והבניין עוד לא עומד במקום.</div>`:""}
      </div>
      ${(b.ig||[]).length&&!G.length?igSec(b):""}
      <div class="ctx${b.priv==="none"?" nocircle":""}">
        ${b.priv==="none"?"":`<div class="circle-wrap"><div class="circle"><div class="mm" id="mm"></div></div><small>1:2500 · FIGURE GROUND${b.priv?" · אזור משוער":""}</small></div>`}
        <dl class="spec">
          <dt>אדריכל</dt><dd>${esc(b.arch)}</dd>
          <dt>שנה</dt><dd class="mono">${b.era==="future"?"בתכנון / בביצוע":(b.year||"—")}</dd>
          <dt>שימוש</dt><dd>${esc(b.use)}</dd>
          <dt>חומרים</dt><dd>${esc(b.mat)}</dd>
          <dt>אזור</dt><dd>${esc(b.hood)}</dd>
          <dt>מיקום</dt>${b.priv?`<dd>${b.priv==="area"?"אזור משוער (בית פרטי)":"לא מפורסם (בית פרטי)"}</dd>`:`<dd class="mono" style="direction:ltr;text-align:right">${b.lat.toFixed(4)}°N ${b.lng.toFixed(4)}°E</dd>`}
        </dl>
      </div>
      <section class="sec"><h4>קריאה אדריכלית</h4><p>${esc(b.read)}</p></section>
      <section class="sec"><h4>מה לחפש במקום</h4><ul class="look">${b.look.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>
      ${(b.ig||[]).length&&G.length?igSec(b):""}
      ${docSec(b)}
      ${b.note?`<section class="sec"><h4>הערת האדריכל</h4><p>${esc(b.note)}</p></section>`:""}
      ${b.priv?"":`<div class="actions">
        <button class="btn primary" data-orbit>סיבוב סביב המבנה</button>
        <a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}" target="_blank" rel="noopener">ניווט</a>
      </div>`}
      <div class="sig">STS ARCH · TEL AVIV ATLAS · ${String(b.id).padStart(2,"0")}/${BUILDINGS.length}</div>
    </div>`;
  plate.hidden=false; plate.scrollTop=0;
  plate.querySelector(".close").onclick=closePlate;
  const ob=plate.querySelector("[data-orbit]"); if(ob) ob.onclick=()=>orbit(b);
  if(b.priv!=="none") miniMap(document.getElementById("mm"),b);
  if(!G.length && b.priv!=="none") heroMap(document.getElementById("hero"),b);
  if(G.length){
    let gi=0;
    const show=i=>{
      gi=(i+G.length)%G.length; const g=G[gi];
      const im=document.getElementById("gimg"); im.src=g.src;
      im.onerror=()=>{ if(G.length>1 && !im.dataset.skip){ im.dataset.skip=1; show(gi+1); } };
      im.onload=()=>{ delete im.dataset.skip; };
      document.getElementById("gcredit").innerHTML = g.lic ? `Photo: ${esc(g.by||"Unknown")} · <a href="${esc(g.page)}" target="_blank" rel="noopener">${esc(g.lic)}</a> · ${esc(g.site||"Wikimedia Commons")}` : `Photo: ${esc(g.by||"STS ARCH")}`;
      const c=document.getElementById("gcount"); if(c) c.textContent=`${String(gi+1).padStart(2,"0")} / ${String(G.length).padStart(2,"0")}`;
      plate.querySelectorAll(".th").forEach(t=>t.setAttribute("aria-current",+t.dataset.i===gi));
    };
    plate.querySelector(".prev")?.addEventListener("click",()=>show(gi-1));
    plate.querySelector(".next")?.addEventListener("click",()=>show(gi+1));
    plate.querySelectorAll(".th").forEach(t=>t.addEventListener("click",()=>show(+t.dataset.i)));
    document.getElementById("gimg").addEventListener("click",()=>openLightbox(G,gi,b));
    show(0);
  }
  stopOrbit();
  if(b.priv!=="none") map.flyTo({center:[b.lng,b.lat],zoom:b.priv?15.4:16.6,pitch:62,bearing:(map.getBearing()+35)%360,duration:reduceMotion?0:2200,essential:true,
    padding:window.innerWidth>860?{left:440,right:380,top:40,bottom:40}:{bottom:window.innerHeight*0.7}});
  render();
  const li=listEl.querySelector(`[data-id="${id}"]`); if(li) li.scrollIntoView({block:"nearest"});
}
function closePlate(){ plate.hidden=true; state.active=null; if(typeof paintFootprints==="function") paintFootprints(); stopOrbit(); if(mini){mini.remove();mini=null;} if(hero){hero.remove();hero=null;} markers.forEach(m=>m.el.classList.remove("active")); render(); }
/* lightbox */
const lb=document.getElementById("lightbox");
let lbG=[],lbI=0;
function lbShow(i){ lbI=(i+lbG.length)%lbG.length; const g=lbG[lbI];
  lb.querySelector("img").src=g.src;
  lb.querySelector(".lbcap").innerHTML=`${String(lbI+1).padStart(2,"0")} / ${String(lbG.length).padStart(2,"0")} · Photo: ${esc(g.by||"Unknown")}${g.lic?` · <a href="${esc(g.page)}" target="_blank" rel="noopener">${esc(g.lic)}</a>`:""}`; }
function openLightbox(G,i,b){ lbG=G; lb.querySelector(".lbtitle").textContent=b.he; lb.hidden=false; lbShow(i); lb.querySelector(".lbclose").focus(); }
lb.querySelector(".lbclose").onclick=()=>{lb.hidden=true;};
lb.querySelector(".lbprev").onclick=()=>lbShow(lbI-1);
lb.querySelector(".lbnext").onclick=()=>lbShow(lbI+1);
lb.addEventListener("click",e=>{ if(e.target===lb) lb.hidden=true; });

document.addEventListener("keydown",e=>{
  if(!lb.hidden){ if(e.key==="Escape") lb.hidden=true; if(e.key==="ArrowLeft") lbShow(lbI+1); if(e.key==="ArrowRight") lbShow(lbI-1); return; }
  if(e.key==="Escape" && !plate.hidden) closePlate();
});

/* orbit */
let orbitId=null;
function orbit(b){
  stopOrbit(); if(reduceMotion) return;
  map.easeTo({center:[b.lng,b.lat],zoom:17,pitch:65,duration:800});
  setTimeout(()=>{ const step=()=>{map.rotateTo((map.getBearing()+0.25)%360,{duration:0}); orbitId=requestAnimationFrame(step);}; orbitId=requestAnimationFrame(step); },850);
}
function stopOrbit(){ if(orbitId){cancelAnimationFrame(orbitId);orbitId=null;} }
map.on("mousedown",stopOrbit); map.on("touchstart",stopOrbit);

/* light */
const bar=document.querySelector(".bar");
bar.addEventListener("click",e=>{
  const b=e.target.closest("button[data-light]"); if(!b) return;
  bar.querySelectorAll("button[data-light]").forEach(x=>x.setAttribute("aria-pressed",x===b));
  setCfg(map,"lightPreset",b.dataset.light);
});

/* ================= צביעת המבנים בתלת־ממד לפי תקופה =================
   שכבת המבנים התלת־ממדית נבנית מ־mapbox-streets-v8, וכל מבנה מהאטלס נצבע דרך feature-state */
const ERA_HEX={eclectic:"#A8C6E1",intl:"#6C9BC8",brutal:"#3A6A99",contemp:"#16365A",future:"#F2C9A8"};
const BASE_GREY="#ECEEF0", SEL_COLOR="#F2C14E";
const FS=new Map();               /* building id -> [feature ids] */
const fpTargets=BUILDINGS.filter(b=>!b.priv&&b.lat);
function pip(pt,ring){let c=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const [xi,yi]=ring[i],[xj,yj]=ring[j];if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))c=!c;}return c;}
function polys(g){return g.type==="Polygon"?[g.coordinates]:g.type==="MultiPolygon"?g.coordinates:[];}
function segDist(p,a,b){const k=Math.cos(p[1]*Math.PI/180)*111320,m=110540;const px=p[0]*k,py=p[1]*m,ax=a[0]*k,ay=a[1]*m,bx=b[0]*k,by=b[1]*m;const dx=bx-ax,dy=by-ay;const t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/((dx*dx+dy*dy)||1)));return Math.hypot(px-ax-t*dx,py-ay-t*dy);}
function polyDist(p,poly){if(pip(p,poly[0]))return 0;let d=1e9;const r=poly[0];for(let i=1;i<r.length;i++)d=Math.min(d,segDist(p,r[i-1],r[i]));return d;}
function collectFootprints(){
  if(!map.getSource("bfp")) return;
  let feats;try{feats=map.querySourceFeatures("bfp",{sourceLayer:"building"});}catch(e){return;}
  if(!feats.length) return;
  const pad=0.00025; /* ~25 מ׳ */
  const boxes=feats.map(f=>{let x0=180,y0=90,x1=-180,y1=-90;polys(f.geometry).forEach(pl=>pl[0].forEach(([x,y])=>{if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}));return [x0-pad,y0-pad,x1+pad,y1+pad];});
  let changed=false;
  fpTargets.forEach(b=>{
    const p=[b.lng,b.lat];const hits=new Set();let best=null,bd=14;
    feats.forEach((f,i)=>{const bx=boxes[i];if(f.id==null||p[0]<bx[0]||p[0]>bx[2]||p[1]<bx[1]||p[1]>bx[3])return;
      polys(f.geometry).forEach(poly=>{const d=polyDist(p,poly);if(d===0)hits.add(f.id);if(d<bd){bd=d;best=f.id;}});});
    const ids=hits.size?[...hits]:(best!=null?[best]:[]);
    if(!ids.length) return;
    const old=FS.get(b.id)||[];
    const merged=[...new Set([...old,...ids])];
    if(merged.length!==old.length){FS.set(b.id,merged);changed=true;}
  });
  if(changed) paintFootprints();
}
function paintFootprints(){
  if(!map.getSource("bfp")) return;
  FS.forEach((ids,id)=>{const b=BUILDINGS[id-1];const st={c:visible(b)?ERA_HEX[b.era]:BASE_GREY,sel:state.active===id};
    ids.forEach(fid=>{try{map.setFeatureState({source:"bfp",sourceLayer:"building",id:fid},st);}catch(e){}});});
}
map.on("style.load",()=>{
  try{
    setCfg(map,"show3dObjects",false); /* המבנים התלת־ממדיים מגיעים מהשכבה שלנו, כדי שאפשר יהיה לצבוע אותם */
    map.addSource("bfp",{type:"vector",url:"mapbox://mapbox.mapbox-streets-v8"});
    map.addLayer({id:"base-ext",type:"fill-extrusion",source:"bfp","source-layer":"building",minzoom:13,
      filter:["!=",["get","underground"],"true"],
      paint:{"fill-extrusion-color":["case",["boolean",["feature-state","sel"],false],SEL_COLOR,["coalesce",["feature-state","c"],BASE_GREY]],
        "fill-extrusion-height":["interpolate",["linear"],["zoom"],13,0,13.6,["coalesce",["get","height"],8]],
        "fill-extrusion-base":["coalesce",["get","min_height"],0],
        "fill-extrusion-opacity":1,"fill-extrusion-ambient-occlusion-intensity":0.35,"fill-extrusion-vertical-gradient":true}});
  }catch(e){console.warn("buildings layer",e);}
});
let fpT=null;
map.on("sourcedata",e=>{ if(e.sourceId==="bfp"&&e.isSourceLoaded){ clearTimeout(fpT); fpT=setTimeout(collectFootprints,300);} });
map.on("idle",collectFootprints);

/* ================= מה יש לידי ================= */
const near={pos:null,watch:null,marker:null};
const locBtn=document.createElement("button");
locBtn.className="locbtn"; locBtn.type="button"; locBtn.setAttribute("aria-pressed","false");
locBtn.innerHTML=`<span class="dot"></span>מה יש לידי`;
document.querySelector(".bar").appendChild(locBtn);
const distM=(a,b)=>{const R=6371000,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lng-a.lng)*t;const x=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x));};
const fmtD=m=>m<1000?`${Math.round(m/10)*10} מ׳`:`${(m/1000).toFixed(1)} ק״מ`;
const walk=m=>`${Math.max(1,Math.round(m/80))} דק׳ הליכה`;
function nearFlyTo(first){
  if(!near.pos) return;
  const vis=BUILDINGS.filter(b=>b.lat&&b.priv!=="none").map(b=>({b,d:distM(near.pos,b)})).sort((x,y)=>x.d-y.d).slice(0,6);
  const pts=[[near.pos.lng,near.pos.lat],...vis.map(x=>[x.b.lng,x.b.lat])];
  const bb=pts.reduce((a,p)=>[Math.min(a[0],p[0]),Math.min(a[1],p[1]),Math.max(a[2],p[0]),Math.max(a[3],p[1])],[180,90,-180,-90]);
  if(first) map.fitBounds([[bb[0],bb[1]],[bb[2],bb[3]]],{padding:{top:90,bottom:60,left:60,right:Math.min(420,innerWidth*0.45)},pitch:55,maxZoom:16.5,duration:reduceMotion?0:2200});
}
function onPos(p){
  const first=!near.pos;
  near.pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
  if(!near.marker){const el=document.createElement("div");el.className="me";el.title="המיקום שלך";near.marker=new mapboxgl.Marker({element:el}).setLngLat([near.pos.lng,near.pos.lat]).addTo(map);}
  else near.marker.setLngLat([near.pos.lng,near.pos.lat]);
  const far=BUILDINGS.every(b=>!b.lat||distM(near.pos,b)>15000);
  locBtn.querySelector(".dot").classList.toggle("on",true);
  if(far&&first) toast("נראה שאתה מחוץ לתל אביב. הרשימה ממוינת לפי מרחק בכל זאת.");
  render(); nearFlyTo(first);
}
function toast(t){let el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),4200);}
locBtn.addEventListener("click",()=>{
  if(near.watch!=null){navigator.geolocation.clearWatch(near.watch);near.watch=null;near.pos=null;if(near.marker){near.marker.remove();near.marker=null;}locBtn.setAttribute("aria-pressed","false");locBtn.querySelector(".dot").classList.remove("on");render();return;}
  if(!("geolocation" in navigator)){toast("הדפדפן לא תומך במיקום.");return;}
  locBtn.setAttribute("aria-pressed","true"); toast("מאתר את המיקום שלך…");
  near.watch=navigator.geolocation.watchPosition(onPos,err=>{
    toast(err.code===1?"אין הרשאת מיקום. אפשר לאשר אותה בהגדרות הדפדפן ולנסות שוב.":"לא הצלחתי לאתר מיקום. נסה שוב בחוץ או עם GPS.");
    if(near.watch!=null) navigator.geolocation.clearWatch(near.watch); near.watch=null; locBtn.setAttribute("aria-pressed","false");
  },{enableHighAccuracy:true,maximumAge:15000,timeout:20000});
});

/* ================= מעבר בין מוד מפה למוד תלת־ממד ================= */
const viewBtn=document.createElement("button");
viewBtn.className="viewbtn";viewBtn.type="button";viewBtn.setAttribute("aria-pressed","false");
viewBtn.textContent="מפה 2D";viewBtn.title="מעבר בין מפה שטוחה לתלת־ממד";
document.querySelector(".bar").appendChild(viewBtn);
let flat=false;
function applyView(){
  try{
    if(map.getLayer("base-ext")) map.setLayoutProperty("base-ext","visibility",flat?"none":"visible");
    if(map.getLayer("base-fill")) map.setLayoutProperty("base-fill","visibility",flat?"visible":"none");
  }catch(e){}
  viewBtn.textContent=flat?"תלת־ממד 3D":"מפה 2D";
  viewBtn.setAttribute("aria-pressed",String(flat));
}
viewBtn.addEventListener("click",()=>{
  flat=!flat; stopOrbit();
  map.easeTo(flat?{pitch:0,bearing:0,duration:reduceMotion?0:900}:{pitch:60,bearing:71,duration:reduceMotion?0:900});
  map.dragRotate[flat?"disable":"enable"](); map.touchZoomRotate[flat?"disableRotation":"enableRotation"]();
  applyView();
});
map.on("style.load",()=>{
  try{
    map.addLayer({id:"base-fill",type:"fill",source:"bfp","source-layer":"building",minzoom:13,layout:{visibility:"none"},
      filter:["!=",["get","underground"],"true"],
      paint:{"fill-color":["case",["boolean",["feature-state","sel"],false],SEL_COLOR,["coalesce",["feature-state","c"],"#E4E7EA"]],
        "fill-outline-color":"#C9CED3","fill-emissive-strength":0.6}},"base-ext");
  }catch(e){console.warn("base-fill",e);}
  applyView();
});

render();
</script>
</body>
</html>
